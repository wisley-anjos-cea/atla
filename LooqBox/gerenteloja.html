<style>
    .item-container {
        display: grid;
        grid-template-columns: repeat(4, auto); 
        justify-content: center;               
        column-gap: 22px;                      
        row-gap: 20px;
        padding: 10px;
        width: 100%;
    }
    
    @media (max-width: 900px) {
        .item-container {
            grid-template-columns: repeat(3, minmax(80px, 1fr));
            column-gap: 20px;
        }
    }
    
    @media (max-width: 600px) {
        .item-container {
            grid-template-columns: repeat(3, minmax(80px, 1fr));
            column-gap: 16px;
            row-gap: 18px;
        }
    }

    
    .item {
        display: flex;
        flex-direction: column;
        align-items: center; /* garante centralização horizontal */
        text-align: center;
    }
    
    .circular-background {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 80px;
        height: 80px;
        border-radius: 50% 30% 50% 30%;
        background: #4600fa;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); 
        margin: 0px;
        transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .circular-background:hover {
        border-color: #4600fa;
        box-shadow: 0 0 6px #4600fa;
    }

    .mini-circular {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        width: 50px;
        height: 50px;
    }
    
    .circular-background img {
        width: 45px;
        height: 45px;
    }
    
    .icon-text {
        color: rgb(119, 119, 119);
        text-align: center;
        display: block;
        margin-top: 4px;
        line-height: 1.2;
        white-space: normal;
        width: 85px;
    }
    
    .home-button-with-zoom a {
        text-decoration: none;
    }

</style>
